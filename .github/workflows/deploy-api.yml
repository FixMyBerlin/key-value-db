name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/kv-client/**'
      - '.github/workflows/deploy-api.yml'
      - 'knip.config.mjs'
      - 'oxfmt.config.mjs'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Bundle and validate without uploading
        type: boolean
        default: true

jobs:
  test:
    name: check-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check-ci

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    environment:
      name: cloudflare
      url: https://${{ vars.KV_HOST }}/v1/health
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Stamp build-info
        run: printf "export const BUILD_SHA = '%s'\n" "$GITHUB_SHA" > src/build-info.ts
      - name: Apply D1 migrations
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 migrations apply DB --remote
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'deploy --dry-run --outdir dist' || 'deploy' }}
      - name: Assert health
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        working-directory: .
        env:
          KV_HOST: ${{ vars.KV_HOST }}
        run: |
          curl -fsS --retry 5 --retry-delay 2 "https://$KV_HOST/v1/health" \
            | jq -e --arg sha "$GITHUB_SHA" '.ok and .commit == $sha'
      - name: Step summary
        if: always()
        working-directory: .
        env:
          KV_HOST: ${{ vars.KV_HOST }}
        run: |
          {
            echo "## Deploy API"
            echo "- sha: \`$GITHUB_SHA\`"
            echo "- dry_run: \`${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}\`"
            echo "- KV_HOST: \`$KV_HOST\`"
            echo "- health: \`https://$KV_HOST/v1/health\`"
          } >> "$GITHUB_STEP_SUMMARY"
