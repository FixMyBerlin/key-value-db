# Publishes packages/kv-client to npm. Adapted from osm-editor-kit/maplibre-editor-layer-index.
name: Release client

on:
  push:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'packages/kv-client/**'
      - '.github/workflows/release-client.yml'
  workflow_dispatch:
    inputs:
      version_bump:
        description: Force a version bump (none = only if pending changesets exist)
        type: choice
        options: [none, patch, minor, major]
        default: none
      publish_only:
        description: Publish the current version to npm without bumping (retry after a failed publish)
        type: boolean
        default: false

concurrency: release

permissions:
  contents: write
  issues: write
  id-token: write # npm trusted publishing / provenance

jobs:
  release:
    # Skip bot commits from this workflow (version bumps) to avoid loops.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Detect pending changesets
        id: pending
        run: |
          shopt -s nullglob
          files=(.changeset/*.md)
          for f in "${files[@]}"; do
            case "$(basename "$f")" in README.md) continue ;; esac
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Plan release
        id: plan
        env:
          HAS_CHANGESETS: ${{ steps.pending.outputs.found }}
          VERSION_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump || 'none' }}
          PUBLISH_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_only || 'false' }}
        run: |
          if [ "$PUBLISH_ONLY" = true ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "publish_only=true" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_CHANGESETS" = true ] || [ "$VERSION_BUMP" != none ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "publish_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to version or publish."
          fi

      - name: Check, build, check exports
        if: steps.plan.outputs.release == 'true'
        run: |
          bun run check-ci
          bun run --filter @osm-editor-kit/key-value-db-client build
          bun run --filter @osm-editor-kit/key-value-db-client check-exports

      - name: Version and commit
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.publish_only != 'true'
        env:
          HAS_CHANGESETS: ${{ steps.pending.outputs.found }}
          VERSION_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump || 'none' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$HAS_CHANGESETS" != true ] && [ "$VERSION_BUMP" != none ]; then
            cat > ".changeset/manual-${{ github.run_id }}.md" <<EOF
          ---
          "@osm-editor-kit/key-value-db-client": $VERSION_BUMP
          ---

          Release ($VERSION_BUMP).
          EOF
          fi

          bun run version-packages
          bun run format
          git add -A
          if git diff --staged --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore: release [skip ci]"
            HUSKY=0 git push
          fi

      - name: Setup Node for npm OIDC publishing
        if: steps.plan.outputs.release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        if: steps.plan.outputs.release == 'true'
        run: |
          npm install -g npm@latest
          bun run release

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Release workflow failed'
            const body = `The \`release-client\` workflow failed (check, build, or npm publish).\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'release-failure',
            })
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['release-failure'],
              })
            }
